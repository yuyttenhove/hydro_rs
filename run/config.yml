time_integration:
  dt_min: 1e-10
  dt_max: 0.05
  t_end: 0.2
  sync_timesteps: true

snapshots:
  dt_snap: 0.01
  prefix: sodshock_1D_waf_tvd
  save_faces: true

engine:
  dt_status: 0.
  particle_motion: fixed
  # runner: DefaultHalfDrift
  # runner: OptimalOrderHalfDrift
  # runner: TwoVolumeHalfDrift
  # runner: MeshlessGradientHalfDrift
  # runner: FluxExtrapolateHalfDrift
  runner: OptimalOrder
  # runner: TwoGradient
  # runner: Default
  # runner: Pakmor
  # runner: PakmorExtrapolate
  # runner: VolumeBackExtrapolate
gravity:
  kind: none
  potential:
    kind: constant
    acceleration: [0., -1., 0.]

hydrodynamics:
  solver: MUSCL
  equation_of_state: Ideal
  gamma: 1.66666667
  cfl_criterion: 0.8
  TVD: true
  flux_limiter: "superbee"
  slope_limiter:
    kind: "gradients"
    beta: 1.
  riemann_solver:
    kind: "Exact"
    threshold: 2.
    velocity: [1., 0., 0.]

space:
  boundary: reflective
  max_top_level_cells: 8

initial_conditions:
  kind: sodshock
  dimensionality: 1
  box_size: [ 2., 1., 1. ]
  num_part: 250
  perturbations: 0.0
  filename: ICs/advection_wave_100.hdf5